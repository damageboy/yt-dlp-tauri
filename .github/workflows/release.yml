name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, commit, or tag to build in preflight mode"
        required: false
        default: master
        type: string
      publish:
        description: "Publish installers for an existing version tag"
        required: false
        default: false
        type: boolean
      tag:
        description: "Existing v* release tag; required when publish is enabled"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  BUILD_REF: ${{ github.event_name == 'push' && github.sha || (inputs.publish && format('refs/tags/{0}', inputs.tag) || inputs.ref) }}
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.publish && inputs.tag || 'master-build') }}

jobs:
  build-release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: "--bundles nsis"
            installer: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: macos-aarch64
            platform: macos-15
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin --bundles dmg"
            installer: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            platform: macos-15-intel
            rust-target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin --bundles dmg"
            installer: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install Node dependencies
        run: npm ci

      - name: Verify release identity
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$PUBLISH" = "true" ] && [ "$RELEASE_TAG" != "master-build" ]; then
            if [ "$RELEASE_TAG" != "v${version}" ]; then
              echo "::error::Release tag must match package version v${version}"
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            node .github/scripts/extract-release-notes.mjs --version "$RELEASE_TAG" --output release-notes.md
          fi

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test Rust backend
        run: cargo test --locked --manifest-path ./src-tauri/Cargo.toml --lib --bins --tests

      - name: Check Rust backend
        run: cargo check --locked --manifest-path ./src-tauri/Cargo.toml --all-targets

      - name: Build installer
        run: npm run tauri build -- ${{ matrix.tauri-args }} --ci

      - name: Verify clean installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -ReportPath release-preflight-report.json

      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil verify ${{ matrix.installer }}

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows verification report
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer-report
          path: release-preflight-report.json
          if-no-files-found: warn

  publish-release:
    name: Publish installers
    runs-on: ubuntu-latest
    needs: build-release
    if: ${{ github.event_name == 'push' || inputs.publish }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          cp src-tauri/tools-manifest.json release-assets/
          (cd release-assets && sha256sum ./*.exe ./*.dmg tools-manifest.json > SHA256SUMS)
          if [ "$RELEASE_TAG" = "master-build" ]; then
            printf 'Latest successful master build: %s\n\nWindows x64 and macOS Apple Silicon / Intel installers. These builds are unsigned.\n' "$commit_sha" > release-notes.md
            title="Master build ${commit_sha:0:12}"
            flags=(--prerelease --latest=false)
            if gh api "repos/$GH_REPO/git/ref/tags/master-build" > /dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/master-build" -f sha="$commit_sha" -F force=true
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/master-build -f sha="$commit_sha"
            fi
          else
            node .github/scripts/extract-release-notes.mjs --version "$RELEASE_TAG" --output release-notes.md
            printf '\nBuild commit: %s\n\nWindows and macOS installers are unsigned.\n' "$commit_sha" >> release-notes.md
            title="yt-dlp-tauri $RELEASE_TAG"
            flags=(--prerelease=false)
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [ "$RELEASE_TAG" = "master-build" ]; then
            while IFS= read -r asset; do
              if [ ! -f "release-assets/$asset" ]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          fi
          gh release edit "$RELEASE_TAG" --draft=false --title "$title" --notes-file release-notes.md "${flags[@]}"
